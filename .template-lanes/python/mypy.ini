# mypy.ini - the type gate for the python lane.
#
# `strict = True` is the gate; the disallow_* / warn_* lines below are spelled
# out on purpose even though strict already implies them. strict is a bundle, and
# a bundle is exactly what a future mypy release redefines: when upstream decides
# to drop or soften one member of it, the flag written here keeps saying what this
# repo requires, and the change shows up as a deliberate edit instead of a quiet
# loss of checking.

[mypy]
# Matches requires-python in pyproject.toml. Keep the two in step; a python
# version mypy does not know about fails the run rather than checking nothing.
python_version = 3.11
strict = True

# Spelled out for the reason above: each is what it says, independent of what
# "strict" happens to mean in the version installed on a runner.
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_any_generics = True
disallow_subclassing_any = True
no_implicit_optional = True
no_implicit_reexport = True
strict_optional = True
strict_equality = True
strict_bytes = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_configs = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True

# The package lives under src/ (the src layout), so imports of
# `__PROJECT_MODULE__` resolve without installing the project first.
mypy_path = src
explicit_package_bases = True
namespace_packages = True

# Checked by hand as `mypy src tests`; the lane script and CI both pass those
# two paths, so this file holds no `files` list that could silently disagree
# with the command line.
