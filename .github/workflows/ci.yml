# ci.yml - the merge gate.
#
# What this workflow protects: the claim that `main` works. Every job here is a
# promise that was previously only asserted in prose, so the rules that govern it
# are the same ones that govern the pre-commit hooks:
#
#   - A check that silently skips is a bug. Every job that depends on a tool
#     starts with `Guard: no silent skip`, which fails the run when the tool is
#     absent or does not answer --version. `command -v foo || exit 0` is banned;
#     if it appears in a diff, the review rejects it.
#   - Everything is pinned. Actions are pinned to a released major tag, and a
#     third-party action should be pinned to a full commit SHA once you have
#     verified the tag (`git ls-remote https://github.com/<owner>/<repo>
#     <tag>`); the tag is a moving ref and anyone with write access to that repo
#     can repoint it. Runner images are pinned to `ubuntu-24.04`, not
#     `ubuntu-latest`, so a runner image refresh cannot change what "green" means.
#   - Least privilege. Top level is `permissions: contents: read`; a job that
#     needs more says so explicitly and nothing here needs more.
#
# Local equivalent of the whole file:
#
#   make lint && make test && make validate
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. If a job needs to write, raise it per job and say why in a
# comment next to it; do not raise it here.
permissions:
  contents: read

# Serialise per ref and cancel the superseded run: two pushes ten seconds apart
# should cost one runner set, not two, and only the newest tree matters.
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_COMPILE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # changes: decides whether there is anything to build or test.
  #
  # It exists so a markdown-only pull request does not burn a container build and
  # a full test matrix. It is the only job allowed to make another job skip, and
  # ci-gate below verifies that a skip was earned rather than assumed - a filter
  # that silently skips the test job on a bad pattern is the exact bug this file
  # is written to prevent.
  # ---------------------------------------------------------------------------
  changes:
    name: changes (path filter)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: ci-changes-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Check out the tree
        uses: actions/checkout@v5

      # Third-party action: pinned to a major tag. Verify the SHA behind the tag
      # before bumping it, and prefer a full commit SHA for anything this gate
      # depends on.
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'Makefile'
              - 'Dockerfile*'
              - '.github/workflows/**'
              - '.template-lanes/**'
              - '*.go'
              - '*.py'
              - 'go.mod'
              - 'go.sum'
              - 'package.json'
              - 'package-lock.json'
              - 'pyproject.toml'
              - 'requirements*.txt'
            docs_only:
              - '**/*.md'
              - 'docs/**'
              - 'LICENSE'
              - '.github/CODEOWNERS'
              - '.github/PULL_REQUEST_TEMPLATE.md'
              - '.github/ISSUE_TEMPLATE/**'

  # ---------------------------------------------------------------------------
  # lint: the tree is formatted, parseable, and free of the defects a linter can
  # see. It protects review time (no formatting churn in diffs) and it protects
  # correctness where the linter is a real analyser - shellcheck catching an
  # unquoted expansion is a bug fix, not a style opinion.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (shell, yaml, markdown, json)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the tree
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Every tool version in this job comes from one file. A version literal
      # written into this workflow is a bug, because then the image build,
      # `make doctor` and CI can each quietly drift to a different release, which
      # is exactly how a "green" check stops meaning anything.
      - name: Load pinned tool versions
        run: |
          set -euo pipefail
          if [ ! -f tool-versions.env ]; then
            echo "::error::tool-versions.env is missing; every tool version here comes from it"
            exit 1
          fi
          grep -E '^[A-Z0-9_]+=' tool-versions.env >>"$GITHUB_ENV"

      - name: Install lint toolchain (pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "yamllint==${YAMLLINT_VERSION}" "pre-commit==${PRE_COMMIT_VERSION}"
          npm install --global "prettier@${PRETTIER_VERSION}"
          # bats, shellcheck and shfmt are downloaded at their pinned version from the
          # project that releases each of them. The runner image ships whatever apt
          # happened to freeze, and a package registry does not carry every release, so
          # both routes silently disagree with tool-versions.env. Everything lands in
          # one job-owned prefix because the runner has no write access to /usr/local.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/bats.tar.gz \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz"
          tar -xzf /tmp/bats.tar.gz -C /tmp
          "/tmp/bats-core-${BATS_VERSION}/install.sh" "$HOME/.local"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "$HOME/.local/bin/shellcheck"
          curl -fsSL -o "$HOME/.local/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod 0755 "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      # Runs after the install, so "is the tool present" is a question that can be
      # answered. A guard that runs before the tools exist can only ever report its
      # own ordering, and a guard that skips when a tool is absent reports green
      # while proving nothing.
      - name: "Guard: no silent skip"
        run: |
          set -euo pipefail
          missing=0
          require() {
            local tool="$1" install="$2"
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::required tool '$tool' is not installed. Install: $install"
              missing=$((missing + 1))
              return
            fi
            if ! "$tool" --version >/dev/null 2>&1; then
              echo "::error::required tool '$tool' is on PATH but does not answer --version. Install: $install"
              missing=$((missing + 1))
              return
            fi
            echo "ok: $tool $("$tool" --version 2>&1 | head -n 1)"
          }
          require git        "apt-get install -y git"
          require python3    "apt-get install -y python3"
          require node       "apt-get install -y nodejs"
          require shellcheck "see 'Install lint toolchain (pinned)'; pinned by SHELLCHECK_VERSION"
          require shfmt      "see 'Install lint toolchain (pinned)'; pinned by SHFMT_VERSION"
          require bats       "see 'Install lint toolchain (pinned)'; pinned by BATS_VERSION"
          require yamllint   "see 'Install lint toolchain (pinned)'; pinned by YAMLLINT_VERSION"
          require prettier   "npm install --global prettier, pinned by PRETTIER_VERSION"
          require pre-commit "see 'Install lint toolchain (pinned)'; pinned by PRE_COMMIT_VERSION"
          if [ "$missing" -ne 0 ]; then
            echo "::error::${missing} required tool(s) missing or broken. Do not gate this step behind 'command -v ... || exit 0': a check that silently skips is a bug."
            exit 1
          fi

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') || 'none' }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit hooks over every file
        run: pre-commit run --all-files

      - name: Fail if a hook had to rewrite a file
        run: |
          set -euo pipefail
          if ! git diff --exit-code --stat; then
            echo "::error::a formatting hook rewrote files, which means they were committed unformatted. Run 'pre-commit run --all-files' locally, commit the result, and push."
            git diff
            exit 1
          fi

      # Lane-owned linters (golangci-lint, ruff, eslint, ...) are added here by the
      # lane overlay. A lane adds its own install step immediately before its lint
      # step, so the tool is guaranteed present; it must never be wrapped in a
      # presence check that skips.

  # ---------------------------------------------------------------------------
  # test: the behaviour the README and the doc comments claim is the behaviour
  # that ships. It is skipped only when `changes` proves no code path was
  # touched, and ci-gate verifies that proof rather than trusting the skip.
  # ---------------------------------------------------------------------------
  test:
    name: test (unit + integration)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    steps:
      - name: Check out the tree
        uses: actions/checkout@v5

      - name: Load pinned tool versions
        # Read before the setup actions, so the runtimes this job installs are the
        # runtimes tool-versions.env names. A runner on a floating "stable" proves a
        # different thing than the pin the dev container and CI are meant to share.
        run: |
          set -euo pipefail
          if [ ! -f tool-versions.env ]; then
            echo "::error::tool-versions.env is missing; every tool version here comes from it"
            exit 1
          fi
          grep -E '^[A-Z0-9_]+=' tool-versions.env >>"$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install lane toolchains (pinned)
        # make test stages every lane under .template-lanes/ and runs each one, so this
        # job needs what the lane runners invoke, not just a shell. bats comes from the
        # bats-core tag rather than a package registry because the registry does not
        # carry every release; the python tools come from the same pin file.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/bats.tar.gz \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz"
          tar -xzf /tmp/bats.tar.gz -C /tmp
          "/tmp/bats-core-${BATS_VERSION}/install.sh" "$HOME/.local"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check \
            "pytest==${PYTEST_VERSION}" "pytest-cov==${PYTEST_COV_VERSION}" \
            "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}"

      - name: "Guard: no silent skip"
        run: |
          set -euo pipefail
          missing=0
          require() {
            local tool="$1" install="$2"
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::required tool '$tool' is not installed. Install: $install"
              missing=$((missing + 1))
              return
            fi
            if ! "$tool" --version >/dev/null 2>&1; then
              echo "::error::required tool '$tool' is on PATH but does not answer --version. Install: $install"
              missing=$((missing + 1))
              return
            fi
            echo "ok: $tool $("$tool" --version 2>&1 | head -n 1)"
          }
          require git     "apt-get install -y git"
          require make    "apt-get install -y make"
          require python3 "apt-get install -y python3"
          require node    "see 'Set up Node'; pinned by NODE_VERSION"
          require npm     "see 'Set up Node'; pinned by NODE_VERSION"
          require bats    "see 'Install lane toolchains (pinned)'; pinned by BATS_VERSION"
          require pytest  "see 'Install lane toolchains (pinned)'; pinned by PYTEST_VERSION"
          # The go command answers `go version`, not `go --version`, so the generic
          # probe above cannot ask it the right question; ask it the one it answers.
          if ! go version >/dev/null 2>&1; then
            echo "::error::go is not installed and the go lane needs it (pinned by GO_VERSION)"
            missing=$((missing + 1))
          else
            echo "ok: $(go version 2>&1)"
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing required tool(s) missing or broken. Fix the environment; do not skip the suite."
            exit 1
          fi

      - name: Cache dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: deps-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml', 'package-lock.json', 'go.sum') || 'none' }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Run the test suite
        # `make test` owns dependency installation and coverage output, so CI and a
        # contributor's terminal run the identical recipe. In this repository the
        # target takes the lane-staging path (a template checkout has no lane at its
        # root), so every overlay under .template-lanes/ is copied into a scratch tree
        # and actually executed here. Coverage is reported rather than asserted until
        # the suite has a floor worth defending; a threshold nobody enforces is
        # decoration, and `|| true` around a suite is the bug this file exists to
        # remove.
        run: make test

  # ---------------------------------------------------------------------------
  # secret-scan: no credential reaches `main`, ever. A secret in git history
  # cannot be deleted by removing it later, so this job is the last cheap chance
  # to stop one. It scans full history, because a key committed three months ago
  # and "already removed" is still live in every clone.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: secret-scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: ci-secret-scan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the full history
        uses: actions/checkout@v5
        with:
          # Full history is required: a shallow clone scans only the tip and
          # reports green over a leak buried in the commits it did not fetch.
          fetch-depth: 0

      - name: "Guard: no silent skip"
        run: |
          set -euo pipefail
          command -v git >/dev/null 2>&1 || { echo "::error::git is missing; install with apt-get install -y git"; exit 1; }
          git --version
          commits="$(git rev-list --count HEAD)"
          echo "ok: scanning $commits commits"
          if [ "$commits" -lt 1 ]; then
            echo "::error::no commits to scan; the checkout is empty or shallow"
            exit 1
          fi

      # Third-party action: pinned to a major tag; verify the SHA before bumping.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify no gitignored secret-shaped file is tracked
        run: |
          set -euo pipefail
          leaked="$(git ls-files | grep -E '(^|/)\.env$|^\.env\.' | grep -v '\.example$' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::env file(s) are tracked in git: $leaked. Untrack them with 'git rm --cached <path>', keep the documented twin as <path>.example, and rotate anything they contained."
            exit 1
          fi
          if git ls-files | grep -E '\.(coverage|coverage\.xml|bak)$|__pycache__/|coverage\.xml$' >/dev/null 2>&1; then
            echo "::error::build or coverage artifacts are tracked in git. Remove them from the index; they are derived, so a committed copy is a stale claim about test health."
            git ls-files | grep -E '\.(coverage|coverage\.xml|bak)$|__pycache__/|coverage\.xml$'
            exit 1
          fi
          echo "ok: no tracked .env, coverage, or backup artifacts"

  # ---------------------------------------------------------------------------
  # ci-gate: the single required check.
  #
  # Configure branch protection to require *this* job, not the individual ones:
  # adding a job to this file then cannot weaken the gate, because this job must
  # be taught to accept it. It treats anything that is not `success` - failure,
  # cancellation, or a skip nobody justified - as red.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: ci-gate (all required checks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: ci-gate-${{ github.ref }}
      cancel-in-progress: true
    needs: [changes, lint, test, secret-scan]
    if: always()
    steps:
      - name: Verify every required job succeeded
        env:
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_SCAN: ${{ needs.secret-scan.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          failed=0
          verdict() {
            local name="$1" result="$2" allow_skip="${3:-no}"
            case "$result" in
              success)
                echo "ok:   $name"
                ;;
              skipped)
                if [ "$allow_skip" = "yes" ]; then
                  echo "note: $name was skipped, and the filter proves that was correct"
                else
                  echo "::error::$name was skipped. A check that silently skips is a bug."
                  failed=$((failed + 1))
                fi
                ;;
              *)
                echo "::error::$name is '$result' - not green."
                failed=$((failed + 1))
                ;;
            esac
          }
          verdict "changes"     "$RESULT_CHANGES"
          verdict "lint"        "$RESULT_LINT"
          # A skip is defensible only when the path filter proved no code changed.
          if [ "$CODE_CHANGED" = "false" ]; then
            verdict "test" "$RESULT_TEST" yes
          else
            verdict "test" "$RESULT_TEST"
          fi
          verdict "secret-scan" "$RESULT_SCAN"
          if [ "$failed" -ne 0 ]; then
            echo "::error::ci-gate failed: $failed required check(s) were not green. Read the job above that is not 'success'; do not re-run hoping for a flake."
            exit 1
          fi
          echo "summary: all required checks green"
